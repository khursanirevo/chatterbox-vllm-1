<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatterbox vLLM Streaming TTS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .status.connecting {
            background: #fff3cd;
            color: #856404;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .status.connected .status-dot {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .setting {
            display: flex;
            flex-direction: column;
        }

        .setting input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9em;
            transition: border-color 0.3s;
        }

        .setting input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .progress-container {
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            height: 8px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            width: 0%;
        }

        .progress-text {
            padding: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .metrics {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .metrics.active {
            display: block;
        }

        .metrics h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .metric {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .metric-label {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        .log {
            background: #1a1a1a;
            color: #00ff00;
            border-radius: 12px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            display: none;
        }

        .log.active {
            display: block;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 4px;
        }

        .log-entry.info {
            color: #00ff00;
        }

        .log-entry.success {
            color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
        }

        .log-entry.error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .audio-player {
            margin-top: 20px;
            display: none;
        }

        .audio-player.active {
            display: block;
        }

        .audio-player audio {
            width: 100%;
            border-radius: 10px;
        }

        .preset-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .preset-btn {
            padding: 8px 15px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .toggle-log {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 0.9em;
            color: #666;
        }

        .toggle-log input {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Chatterbox vLLM Streaming TTS</h1>
        <p class="subtitle">Real-time text-to-speech with < 1s first audio chunk latency</p>

        <div id="status" class="status disconnected">
            <div class="status-dot"></div>
            <span id="statusText">Disconnected</span>
        </div>

        <div class="preset-buttons">
            <button class="preset-btn" onclick="setPreset('Hello world, this is a test of the streaming TTS system.')">Short</button>
            <button class="preset-btn" onclick="setPreset('The quick brown fox jumps over the lazy dog. This sentence contains every letter of the alphabet and demonstrates the text-to-speech capabilities.')">Medium</button>
            <button class="preset-btn" onclick="setPreset('Artificial intelligence has revolutionized how we interact with technology in recent years. From virtual assistants that can understand natural language to autonomous vehicles that navigate complex environments, AI is becoming increasingly sophisticated. This advancement brings both exciting opportunities and important challenges as we continue to develop these powerful systems.')">Long</button>
            <button class="preset-btn" onclick="setPreset('Welcome to Chatterbox vLLM! This streaming TTS system uses AsyncLLMEngine for ultra-low latency text-to-speech synthesis. We achieved sub-second first audio chunk through continuous batching and efficient token streaming. Feel free to test different texts and settings!')">About</button>
        </div>

        <div class="input-group">
            <label for="textInput">Text to synthesize:</label>
            <textarea id="textInput" placeholder="Enter text here...">Hello world, this is a test of the streaming TTS system.</textarea>
        </div>

        <div class="settings">
            <div class="setting">
                <label for="temperature">Temperature</label>
                <input type="number" id="temperature" value="0.8" min="0" max="2" step="0.1">
            </div>
            <div class="setting">
                <label for="maxTokens">Max Tokens</label>
                <input type="number" id="maxTokens" value="500" min="100" max="2000" step="100">
            </div>
            <div class="setting">
                <label for="chunkSize">Chunk Size</label>
                <input type="number" id="chunkSize" value="25" min="10" max="100" step="5">
            </div>
        </div>

        <div class="button-group">
            <button id="connectBtn" class="btn-secondary" onclick="toggleConnection()">Connect</button>
            <button id="generateBtn" class="btn-primary" onclick="generateSpeech()" disabled>🎤 Generate Speech</button>
        </div>

        <div class="toggle-log">
            <input type="checkbox" id="showLog" onchange="toggleLog()">
            <label for="showLog">Show detailed logs</label>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">Initializing...</div>
        </div>

        <div class="metrics" id="metrics">
            <h3>📊 Generation Metrics</h3>
            <div class="metrics-grid">
                <div class="metric">
                    <div class="metric-value" id="firstTokenLatency">-</div>
                    <div class="metric-label">First Token (ms)</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="firstChunkLatency">-</div>
                    <div class="metric-label">First Chunk (ms)</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="totalTime">-</div>
                    <div class="metric-label">Total Time (s)</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="chunksReceived">-</div>
                    <div class="metric-label">Chunks</div>
                </div>
            </div>
        </div>

        <div class="audio-player" id="audioPlayer">
            <audio id="audio" controls></audio>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        let ws = null;
        let audioContext = null;
        let audioQueue = [];
        let isPlaying = false;
        let audioChunks = [];
        let startTime = null;
        let firstChunkTime = null;

        // WebSocket connection
        function toggleConnection() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                disconnect();
            } else {
                connect();
            }
        }

        function connect() {
            const wsUrl = 'ws://localhost:8000/tts/websocket';
            updateStatus('connecting', 'Connecting...');

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    updateStatus('connected', 'Connected');
                    document.getElementById('connectBtn').textContent = 'Disconnect';
                    document.getElementById('generateBtn').disabled = false;
                    log('Connected to server', 'success');
                };

                ws.onmessage = async (event) => {
                    const response = JSON.parse(event.data);
                    handleMessage(response);
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    const errorMsg = error.type || 'Unknown error';
                    log('WebSocket error: ' + errorMsg, 'error');

                    // Log additional details
                    if (ws.readyState === WebSocket.CLOSED) {
                        log('Connection closed - code: ' + (ws.closeCode || 'unknown'), 'error');
                    }
                };

                ws.onclose = (event) => {
                    console.log('WebSocket closed:', event);
                    updateStatus('disconnected', 'Disconnected');
                    document.getElementById('connectBtn').textContent = 'Connect';
                    document.getElementById('generateBtn').disabled = true;
                    log(`Disconnected from server (code: ${event.code}, reason: "${event.reason || 'none'}")`, 'info');
                };
            } catch (error) {
                log('Connection error: ' + error.message, 'error');
                updateStatus('disconnected', 'Connection Failed');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function updateStatus(state, text) {
            const statusEl = document.getElementById('status');
            const statusTextEl = document.getElementById('statusText');

            statusEl.className = 'status ' + state;
            statusTextEl.textContent = text;
        }

        function handleMessage(response) {
            const type = response.type;
            const requestId = response.request_id;

            switch (type) {
                case 'acknowledgment':
                    log(`Request acknowledged: ${response.data?.message || ''}`, 'info');
                    showProgress('Generating tokens...');
                    break;

                case 'progress':
                    const tokens = response.data?.tokens_generated || 0;
                    const maxTokens = response.data?.max_tokens || 0;
                    const progress = (tokens / maxTokens) * 50; // First 50% for token generation
                    updateProgress(progress, `Generated ${tokens}/${maxTokens} tokens`);
                    log(`Progress: ${tokens} tokens generated`, 'info');
                    break;

                case 'audio_chunk':
                    handleAudioChunk(response);
                    break;

                case 'complete':
                    handleComplete(response);
                    break;

                case 'error':
                    log(`Error: ${response.error}`, 'error');
                    hideProgress();
                    break;

                default:
                    log(`Unknown message type: ${type}`, 'info');
            }
        }

        async function handleAudioChunk(response) {
            const chunkIndex = response.data?.chunk_index || 0;
            const audioBase64 = response.data?.audio;
            const sampleRate = response.data?.sample_rate || 24000;

            if (!firstChunkTime) {
                firstChunkTime = performance.now();
                const latency = firstChunkTime - startTime;
                document.getElementById('firstChunkLatency').textContent = latency.toFixed(1);
                log(`⚡ First audio chunk received in ${latency.toFixed(1)}ms`, 'success');
            }

            // Decode base64 audio
            const audioBytes = Uint8Array.from(atob(audioBase64), c => c.charCodeAt(0));

            // Convert to AudioBuffer
            if (!audioContext) {
                audioContext = new AudioContext({ sampleRate: sampleRate });
            }

            try {
                const audioBuffer = await audioContext.decodeAudioData(audioBytes.buffer);
                audioChunks.push(audioBuffer);

                // Update progress (50-100% for audio chunks)
                const progress = 50 + (chunkIndex * 5);
                updateProgress(Math.min(progress, 95), `Receiving chunk ${chunkIndex}...`);

                log(`Received audio chunk #${chunkIndex} (${audioBuffer.duration.toFixed(2)}s)`, 'info');

                // Play audio chunks sequentially
                if (!isPlaying) {
                    playAudioQueue();
                }
            } catch (error) {
                log(`Error decoding audio: ${error.message}`, 'error');
            }
        }

        async function playAudioQueue() {
            if (audioChunks.length === 0 || isPlaying) {
                return;
            }

            isPlaying = true;
            const audioBuffer = audioChunks.shift();

            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);

            source.onended = () => {
                isPlaying = false;
                if (audioChunks.length > 0) {
                    playAudioQueue();
                } else {
                    log('All audio chunks played', 'success');
                }
            };

            source.start();
        }

        function handleComplete(response) {
            const data = response.data || {};
            const totalTime = performance.now() - startTime;

            document.getElementById('totalTime').textContent = (totalTime / 1000).toFixed(2);
            document.getElementById('chunksReceived').textContent = data.chunks_received || audioChunks.length;

            if (data.first_token_ms) {
                document.getElementById('firstTokenLatency').textContent = data.first_token_ms.toFixed(1);
            }

            updateProgress(100, 'Complete!');
            document.getElementById('metrics').classList.add('active');

            log(`✅ Generation complete: ${data.chunks_received || 0} chunks in ${(totalTime / 1000).toFixed(2)}s`, 'success');

            // Hide progress after a delay
            setTimeout(() => {
                hideProgress();
            }, 2000);
        }

        function generateSpeech() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected to server', 'error');
                return;
            }

            // Reset state
            audioChunks = [];
            startTime = performance.now();
            firstChunkTime = null;
            isPlaying = false;

            // Hide metrics
            document.getElementById('metrics').classList.remove('active');

            // Get input
            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                log('Please enter some text', 'error');
                return;
            }

            // Get settings
            const temperature = parseFloat(document.getElementById('temperature').value);
            const maxTokens = parseInt(document.getElementById('maxTokens').value);
            const chunkSize = parseInt(document.getElementById('chunkSize').value);

            // Send request
            const request = {
                text: text,
                request_id: `req-${Date.now()}`,
                temperature: temperature,
                max_tokens: maxTokens,
                chunk_size: chunkSize
            };

            try {
                ws.send(JSON.stringify(request));
                log(`Sending request: "${text.substring(0, 50)}..."`, 'info');
                showProgress('Connecting...');
            } catch (error) {
                log(`Error sending request: ${error.message}`, 'error');
            }
        }

        function showProgress(text) {
            const container = document.getElementById('progressContainer');
            const progressText = document.getElementById('progressText');
            container.classList.add('active');
            progressText.textContent = text;
            updateProgress(0, text);
        }

        function hideProgress() {
            document.getElementById('progressContainer').classList.remove('active');
        }

        function updateProgress(percent, text) {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            progressBar.style.width = percent + '%';
            progressText.textContent = text;
        }

        function setPreset(text) {
            document.getElementById('textInput').value = text;
        }

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function toggleLog() {
            const showLog = document.getElementById('showLog').checked;
            const logEl = document.getElementById('log');
            logEl.classList.toggle('active', showLog);
        }

        // Auto-connect on page load
        window.addEventListener('load', () => {
            log('Page loaded. Click "Connect" to connect to the server.', 'info');
        });
    </script>
</body>
</html>
